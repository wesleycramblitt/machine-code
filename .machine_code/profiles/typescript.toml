# machine_code profile: TypeScript project toolchain.

[commands.build]
binary = "npm"
args = ["run", "build"]
description = "Compile TypeScript to dist/"
timeout_ms = 120000

[commands.test]
binary = "npm"
args = ["run", "test", "--", "--test-reporter=dot"]
description = "Run the test suite (dot reporter; keeps the summary inside the output cap)"
timeout_ms = 300000

[commands.lint]
binary = "npx"
args = ["tsc", "--noEmit"]
description = "Typecheck without emitting"
timeout_ms = 120000

[commands.typecheck]
binary = "npx"
args = ["tsc", "--noEmit"]
description = "Typecheck without emitting"
timeout_ms = 120000

# Dependency directories symlinked into fresh worktrees (see upgrade-plan.md §4.4).
[worktree]
links = ["node_modules"]