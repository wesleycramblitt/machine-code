# machine_code repo policy (committed). Unknown keys are ignored.

# Excluded from every search, in addition to the built-in set:
#   .git, .machine_code/local, node_modules, vendor, dist, build, target, .next, coverage, .cache, .venv, venv, __pycache__
# search_exclude = ["fixtures/large"]

# Capability policy (0-10, hard floors).
#
# `min_fit` is the primary hard gate: the role-weighted mix of the four axes.
# `[agents.<role>.axes]` adds explicit per-axis floors; every role names all
# four axes so a build agent is judged mostly on code/agentic while an
# architect is judged mostly on reasoning/agentic. `min_capability` is only a
# neutral safety floor and is 0 by default. Role axis weights come from
# data/agents/<role>.toml; `[agents.<role>.weights]` can override them. Models
# that pass are scored with the same weighted mix, so a materially better model
# can beat a cheaper one; close models are decided by cost/speed/headroom.
#
# Floors are deliberately permissive enough that every DeepSeek V4/V4.1 Flash
# offer and many other mid-tier models remain selectable: ~166 / 179 / 174 /
# 166 / 168 candidates survive for general / architect / build / review / sudo
# against the 2026-11-01 catalogue.
# Tune with: machine_code models --agent <role> [--min-fit N]

[agents.general]
min_fit = 6.0
[agents.general.axes]
reasoning = 6.0
code = 5.0
agentic = 6.0
general = 5.0

[agents.engineer]
min_fit = 6.0
[agents.engineer.weights]
code = 0.7
agentic = 0.10
reasoning = 0.15
general = 0.05
[agents.engineer.axes]
code = 5.5
agentic = 5.0
reasoning = 6.0
general = 5.0



# Research free offers: keep a weak fallback from burning the turn budget on
# orientation. If no free model clears this bar, the paid tier may pick a
# stronger funded model instead.
[agents.research]
# No default turn or token cap. Set max_turns/budget_tokens here only when this
# repository needs a bound. The repeat and read guards still stop loops.
