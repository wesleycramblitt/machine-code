# machine_code repo policy (committed). Unknown keys are ignored.

# Excluded from every search, in addition to the built-in set:
#   .git, .machine_code/local, node_modules, vendor, dist, build, target, .next, coverage, .cache, .venv, venv, __pycache__
# search_exclude = ["fixtures/large"]

# Capability policy (0-10, hard floors).
#
# `min_fit` is the primary hard gate: the role-weighted mix of the four axes.
# `[agents.<role>.axes]` adds explicit per-axis floors; every role names all
# four axes so a build agent is judged mostly on code/agentic while an
# architect is judged mostly on reasoning/agentic. `min_capability` is only a
# neutral safety floor and is 0 by default. Role axis weights come from
# data/agents/<role>.toml; `[agents.<role>.weights]` can override them. Models
# that pass are scored with the same weighted mix, so a materially better model
# can beat a cheaper one; close models are decided by cost/speed/headroom.
#
# Floors are deliberately permissive enough that every DeepSeek V4/V4.1 Flash
# offer and many other mid-tier models remain selectable: ~166 / 179 / 174 /
# 166 / 168 candidates survive for general / architect / build / review / sudo
# in the paid tier (~8-13 in the free tier) against the 2026-11-01 catalogue.
# Tune with: machine_code models --agent <role> [--min-fit N]
#
# Free offers get their own, looser floor in both tiers (built-in default:
# min_fit 5.5, axes 5/5/5/3). This keeps a zero-price model that trades one
# weak axis for cost in play while paid offers still use the paid floors above.
# Override per role with [agents.<role>.free] / [agents.<role>.free.axes].

[agents.general]
min_fit = 6.0
max_turns = 6
[agents.general.axes]
reasoning = 6.0
code = 5.0
agentic = 6.0
general = 5.0

[agents.architect]
min_fit = 6.0
[agents.architect.axes]
reasoning = 6.0
code = 5.0
agentic = 6.0
general = 5.0

[agents.build]
min_fit = 6.0
[agents.build.axes]
code = 5.5
agentic = 5.0
reasoning = 6.0
general = 5.0

# Free build offers: allow a weak general/reasoning axis when the model is
# otherwise capable and free. The paid floors above still govern paid offers.
[agents.build.free]
min_fit = 5.5
[agents.build.free.axes]
reasoning = 5.0
code = 5.0
agentic = 5.0
general = 3.0

[agents.review]
# Review is the last gate; require a stronger fit than general.
min_fit = 7.0
max_turns = 15
[agents.review.axes]
reasoning = 6.0
code = 5.0
agentic = 6.0
general = 5.0

# Planner free offers: keep a weak fallback from burning the turn budget on
# orientation. If no free model clears this bar, the paid tier may pick a
# stronger funded model instead.
[agents.planner]
# Planning is bounded: create the graph, then stop. A planner that keeps
# re-reading source is not planning; it is burning context.
max_turns = 24
budget_tokens = 180000
[agents.planner.free]
min_fit = 6.5
[agents.planner.free.axes]
reasoning = 6.5
agentic = 6.0

[agents.sudo]
min_fit = 6.0
[agents.sudo.axes]
reasoning = 6.0
code = 5.0
agentic = 6.0
general = 5.0
