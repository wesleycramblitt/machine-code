# machine_code repo policy (committed). Unknown keys are ignored.

# Excluded from every search, in addition to the built-in set:
#   .git, .machine_code/local, node_modules, vendor, dist, build, target, .next, coverage, .cache, .venv, venv, __pycache__
# search_exclude = ["fixtures/large"]

# Capability policy (0-10, hard floors).
#
# `min_capability` is a hard filter on the composite score. `[agents.<role>.axes]`
# adds hard per-axis floors; `[agents.<role>.weights]` sets how the selector
# trades the four catalogue axes for that role (they are normalized). Models
# that pass are scored with the weighted mix, so a materially better model can
# beat a cheaper one; close models are decided by cost/speed/headroom.
#
# Strictness here is deliberate: ~29 / 21 / 19 / 14 / 4 candidates survive for
# general / architect / build / review / sudo against the 2026-11-01 catalogue.
# Tune with: machine_code models --agent <role> [--min-capability N]

[agents.general]
min_capability = 7.4
[agents.general.axes]
reasoning = 7.2
code = 6.0
agentic = 6.0
[agents.general.weights]
reasoning = 0.30
code = 0.30
agentic = 0.25
general = 0.15

[agents.architect]
min_capability = 7.6
[agents.architect.axes]
reasoning = 7.5
agentic = 6.8
code = 5.5
[agents.architect.weights]
reasoning = 0.40
agentic = 0.30
code = 0.15
general = 0.15

[agents.build]
min_capability = 7.6
[agents.build.axes]
reasoning = 7.2
code = 6.0
agentic = 6.5
[agents.build.weights]
code = 0.40
agentic = 0.35
reasoning = 0.15
general = 0.10

[agents.review]
min_capability = 7.7
[agents.review.axes]
reasoning = 7.5
code = 6.0
agentic = 6.5
[agents.review.weights]
reasoning = 0.35
code = 0.35
agentic = 0.20
general = 0.10

[agents.sudo]
min_capability = 7.8
[agents.sudo.axes]
reasoning = 8.0
agentic = 7.5
code = 6.0
[agents.sudo.weights]
agentic = 0.40
code = 0.30
reasoning = 0.20
general = 0.10
