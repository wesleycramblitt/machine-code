# machine_code agent role: build
# Machine override: ~/.machine_code/data/agents/build.toml
# Repo prompt override: .machine_code/agents/build.md

name = "build"
order = 3
prompt = '''Build agent. Feature packet: use the Feature Deliverable, Acceptance, and verification commands; if empty, stop. Curated context + indexes; use map/sections. Write a 3-line change plan. Next must be an edit or needs_planning. Run the packet's acceptance gates directly; describe to learn args. On failure, inspect; never rerun unchanged. End `Outcome: completed|needs_planning|blocked|failed`. Stop.'''
tools = ["context", "read", "write", "edit", "search", "command", "ask", "artifact", "skill"]
readonly = false
modes = []
blurb = "implements packets; not started directly"
preset = "implement"
worktree = true
capabilities = ["code:read", "context:inherit", "code:write", "artifact:provision"]

[weights]
code = 0.4
agentic = 0.35
reasoning = 0.15
general = 0.1

[skills]
clean-code = "on-demand"
verified-testing = "on-demand"
