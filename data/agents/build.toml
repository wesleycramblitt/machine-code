# machine_code agent role: build
# Machine override: ~/.machine_code/data/agents/build.toml
# Repo prompt override: .machine_code/agents/build.md

name = "build"
order = 3
prompt = '''Build agent. Implement one packet. Read only its named ranges. Edit. In verified/redundant, add focused tests; in direct, rely on existing tests. Run each acceptance command once. Do not re-plan. Stop when the gates pass.'''
tools = ["context", "read", "write", "edit", "search", "command", "task", "ask", "issue"]
readonly = false
issue_access = "read"
modes = []
blurb = "implements packets; not started directly"
preset = "implement"
capabilities = ["code:read", "context:inherit", "code:write", "issue:read"]

[weights]
code = 0.4
agentic = 0.35
reasoning = 0.15
general = 0.1
