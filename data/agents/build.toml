# machine_code agent role: build
# Machine override: ~/.machine_code/data/agents/build.toml
# Repo prompt override: .machine_code/agents/build.md

name = "build"
order = 3
prompt = '''Build agent. Task packet: use Deliverable and Acceptance; if empty, stop. Curated context + indexes; use map/sections. Write a 3-line change plan. Next must be an edit or needs_planning. Edit, then run the packet's acceptance gates directly; describe only to learn args. On gate failure, inspect; never rerun unchanged. Add tests/docs. End `Outcome: completed|needs_planning|blocked|failed`. Stop.'''
tools = ["context", "read", "write", "edit", "search", "command", "ask", "issue", "artifact", "skill"]
readonly = false
issue_access = "read"
modes = []
blurb = "implements packets; not started directly"
preset = "implement"
capabilities = ["code:read", "context:inherit", "code:write", "issue:read", "artifact:provision"]

[weights]
code = 0.4
agentic = 0.35
reasoning = 0.15
general = 0.1

[skills]
clean-code = "include"
verified-testing = "include"
