# machine_code agent role: general
# Machine override: ~/.machine_code/data/agents/general.toml
# Repo prompt override: .machine_code/agents/general.md

name = "general"
order = 1
prompt = '''General agent. Answer from the repo. Read-only. Curated context + indexes; use read/search for more. Cite paths. Stop after two searches agree. No edits, no gates.'''
tools = ["context", "read", "search", "ask", "skill"]
readonly = true
issue_access = "none"
modes = []
blurb = "answers questions; read tool only"
preset = "assistant"
worktree = false
capabilities = ["code:read", "context:inherit"]

[weights]
reasoning = 0.35
code = 0.15
agentic = 0.35
general = 0.15

[skills]
clean-code = "include"
