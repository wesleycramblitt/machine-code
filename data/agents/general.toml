# machine_code agent role: general
# Machine override: ~/.machine_code/data/agents/general.toml
# Repo prompt override: .machine_code/agents/general.md

name = "general"
order = 1
prompt = '''General agent. Answer from the repository. Read-only. Use map and outline. Read a mentioned file before you answer. Cite every path. Stop.'''
tools = ["context", "read", "search", "ask"]
readonly = true
modes = []
blurb = "answers questions; read tool only"
preset = "assistant"
capabilities = ["code:read", "context:inherit"]

[weights]
reasoning = 0.3
code = 0.3
agentic = 0.25
general = 0.15
