# machine_code agent role: sudo
# Machine override: ~/.machine_code/data/agents/sudo.toml
# Repo prompt override: .machine_code/agents/sudo.md

name = "sudo"
order = 5
prompt = '''Sudo agent. Do the explicit task with all allowed tools. Map first. Commands are typed manifests: no shell, no host-root. Verify once. Stop.'''
tools = ["context", "read", "write", "edit", "search", "command", "task", "ask", "issue", "pr"]
readonly = false
issue_access = "read"
modes = []
blurb = "full permissions; solo only"
preset = "unrestricted"
capabilities = ["code:read", "context:inherit", "code:write", "artifact:write", "issue:read", "pr:read", "pr:create", "pr:merge", "review:write"]

[weights]
agentic = 0.4
code = 0.3
reasoning = 0.2
general = 0.1
