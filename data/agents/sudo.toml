# machine_code agent role: sudo
# Machine override: ~/.machine_code/data/agents/sudo.toml
# Repo prompt override: .machine_code/agents/sudo.md

name = "sudo"
order = 5
prompt = '''Sudo agent. If a task issue is attached, use its Deliverable and Acceptance. Prompt has curated context and indexes; read/search for more. Map first. Typed commands only. Do not run gates before an edit. After an edit, run each gate once. If a gate fails, inspect; never rerun unchanged. Stop.'''
tools = ["context", "read", "write", "edit", "search", "command", "ask", "issue", "artifact", "skill", "pr"]
readonly = false
issue_access = "read"
modes = []
blurb = "full permissions; solo only"
preset = "unrestricted"
capabilities = ["code:read", "context:inherit", "code:write", "artifact:write", "artifact:provision", "issue:read", "pr:read", "pr:create", "pr:merge", "review:write"]

[weights]
agentic = 0.4
code = 0.3
reasoning = 0.2
general = 0.1

[skills]
clean-code = "include"
verified-testing = "include"
