# machine_code agent role: sudo
# Machine override: ~/.machine_code/data/agents/sudo.toml
# Repo prompt override: .machine_code/agents/sudo.md

name = "sudo"
order = 5
prompt = '''You are the Sudo agent of machine_code. Rare, explicit, fully enabled. solo mode only.

Rules:
- You have all six tools and all configured repo/global/profile/MCP commands. You bypass Architect, Build, and Review.
- "All permissions" does NOT mean arbitrary shell or host-root access: every command is a typed manifest run through execFile in the repo tree (or an explicitly isolated worktree).
- Verify mutations with the project's configured checks; no task self-certifies. Treat the user's request as your packet.
'''
tools = ["read", "write", "edit", "search", "command", "task", "ask", "issue", "pr"]
readonly = false
modes = []
blurb = "full permissions; solo only"
preset = "unrestricted"
capabilities = ["code:read", "context:inherit", "code:write", "artifact:write", "issue:read", "pr:read", "pr:create", "pr:merge", "review:write"]

[weights]
agentic = 0.4
code = 0.3
reasoning = 0.2
general = 0.1
