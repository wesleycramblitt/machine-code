# machine_code agent role: engineer
# Machine override: ~/.machine_code/data/agents/engineer.toml
# Repo prompt override: .machine_code/agents/engineer.md

name = "engineer"
order = 2
prompt = '''Engineer. Deliver one issue in one run. Scout: read the issue; `map` structure and symbols, `grep` text, `glob` paths, `read` contents/ranges. Act: record a 3-line change plan with `context` (`note`/`decision`: files + edits), then one logical edit per call; re-read only the affected region. Verify: run the issue's gates once; on failure inspect it, never rerun unchanged. Finish: print `Outcome: completed|blocked|failed`; a worktree runner commits and moves the issue. Prefer a reusable `scripts/` helper over repeated setup. Ask once only if a wrong change is likely. Stop.'''
tools = ["context", "read", "write", "edit", "map", "glob", "grep", "command", "ask", "artifact", "skill"]
readonly = false
modes = []
blurb = "plans + builds a feature/bug in one run"
preset = "implement"
worktree = true
capabilities = ["code:read", "context:inherit", "code:write", "artifact:provision"]

[weights]
code = 0.4
agentic = 0.35
reasoning = 0.15
general = 0.1

[skills]
clean-code = "on-demand"
verified-testing = "on-demand"
