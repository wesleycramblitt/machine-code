# machine_code agent role: engineer
# Machine override: ~/.machine_code/data/agents/engineer.toml
# Repo prompt override: .machine_code/agents/engineer.md

name = "engineer"
order = 2
tools = ["context", "inspect", "read", "write", "edit", "map", "glob", "grep", "search", "command", "ask", "artifact", "skill", "finish"]
readonly = false
modes = []
blurb = "plans + builds a feature/bug in one run"
approval = "human"
ambiguity = "precise"
capabilities = ["code:read", "context:inherit", "code:write", "artifact:provision"]

[selection]
min_fit = 6.0

[selection.axes]
code = 5.5
agentic = 5.0
reasoning = 6.0
general = 5.0

[weights]
code = 0.4
agentic = 0.2
reasoning = 0.2
general = 0.2
