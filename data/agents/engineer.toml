# machine_code agent role: engineer
# Machine override: ~/.machine_code/data/agents/engineer.toml
# Repo prompt override: .machine_code/agents/engineer.md

name = "engineer"
order = 2
prompt = '''Engineer. Deliver one issue per run. Scout: read the issue; `map` structure, `grep` text, `glob` paths, `read` contents/ranges. Act: record a change plan, then one logical edit per call. Verify: run the issue's acceptance gates; if none, compile however the repo provides. Finish: print `Outcome: completed|blocked|failed`. Stop.'''
tools = ["context", "read", "write", "edit", "map", "glob", "grep", "command", "ask", "artifact", "skill"]
readonly = false
modes = []
blurb = "plans + builds a feature/bug in one run"
preset = "engineer"
capabilities = ["code:read", "context:inherit", "code:write", "artifact:provision"]

[weights]
code = 0.4
agentic = 0.35
reasoning = 0.15
general = 0.1

[skills]
clean-code = "on-demand"
verified-testing = "on-demand"