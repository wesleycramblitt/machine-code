# machine_code agent role: engineer
# Issue curation uses the command tool (architect role only); engineer has no issue write paths.
# Machine override: ~/.machine_code/data/agents/engineer.toml
# Repo prompt override: .machine_code/agents/engineer.md

name = "engineer"
order = 2
tools = ["context", "inspect", "write", "edit", "glob", "command", "ask", "skill", "runData", "finish"]
readonly = false
modes = ["direct", "verified"]
default_mode = "direct"
blurb = "plans + builds a feature/bug in one run"
approval = "human"
ambiguity = "precise"
capabilities = ["code:read", "context:inherit", "code:write", "run:read"]

[mode.direct]
verification = "direct"

[mode.verified]
verification = "verified"

[selection]
min_fit = 5.5

[selection.axes]
code = 5.5
agentic = 5.0
reasoning = 6.0
general = 5.0

[weights]
code = 0.4
agentic = 0.2
reasoning = 0.2
general = 0.2

