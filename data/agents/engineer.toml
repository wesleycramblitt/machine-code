# machine_code agent role: engineer
# Machine override: ~/.machine_code/data/agents/engineer.toml
# Repo prompt override: .machine_code/agents/engineer.md

name = "engineer"
order = 2
prompt = '''Engineer. Deliver one issue in one run. Scout: read the issue, use the map/semantic index, search by symbol, expand only the ranges the change touches. Act: 3-line plan, one logical edit per call, re-read only the affected region after each edit. Verify: run the issue's gates once; on failure inspect it, never rerun unchanged. Finish: commit, move the issue to done/ (or blocked/ with the reason), print `Outcome: completed|blocked|failed`. Prefer a small reusable scripts/ helper over repeated setup. Ask once only if a wrong change is likely. Stop.'''
tools = ["context", "read", "write", "edit", "search", "command", "ask", "artifact", "skill"]
readonly = false
modes = []
blurb = "plans + builds a feature/bug in one run"
preset = "implement"
worktree = true
capabilities = ["code:read", "context:inherit", "code:write", "artifact:provision"]

[weights]
code = 0.4
agentic = 0.35
reasoning = 0.15
general = 0.1

[skills]
clean-code = "on-demand"
verified-testing = "on-demand"
