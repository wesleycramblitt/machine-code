# machine_code agent role: engineer
# Machine override: ~/.machine_code/data/agents/engineer.toml
# Repo prompt override: .machine_code/agents/engineer.md

name = "engineer"
order = 2
prompt = '''Engineer. Deliver one issue per run. Find the files that do the work: `map` locate/outline, `grep` text, `glob` paths. Read only the blocks you will change (`read` symbol/around/range), then edit; batch related hunks in one edit call. Verify: run the issue's acceptance gates; if none, run core:check and the repo's build. Finish: print `Outcome: completed|blocked|failed`. Stop.'''
tools = ["context", "read", "write", "edit", "map", "glob", "grep", "command", "ask", "artifact", "skill"]
readonly = false
modes = []
blurb = "plans + builds a feature/bug in one run"
approval = "human"
ambiguity = "precise"
capabilities = ["code:read", "context:inherit", "code:write", "artifact:provision"]

[weights]
code = 0.4
agentic = 0.35
reasoning = 0.15
general = 0.1

[skills]
clean-code = "on-demand"
verified-testing = "on-demand"