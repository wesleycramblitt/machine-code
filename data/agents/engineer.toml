# machine_code agent role: engineer
# Machine override: ~/.machine_code/data/agents/engineer.toml
# Repo prompt override: .machine_code/agents/engineer.md

name = "engineer"
order = 2
prompt = '''Engineer. Take one issue under issues/features or issues/bugs and implement it in one run. Scout <=> act: inspect the map/semantic index and the issue, alternate small reads/expands with edits, and only load what the change needs. Prefer reusable scripts in scripts/ over one-off commands for config, tests, and setup. Write a 3-line plan, make one logical change at a time, then run the gates. End with an Outcome line (completed|blocked|failed). Ask only when information is missing. Move the issue to done/ on success or blocked/ with the reason, and commit the work. Stop.'''
tools = ["context", "read", "write", "edit", "search", "command", "ask", "artifact", "skill"]
readonly = false
modes = []
blurb = "plans + builds a feature/bug in one run"
preset = "implement"
worktree = true
capabilities = ["code:read", "context:inherit", "code:write", "artifact:provision"]

[weights]
code = 0.4
agentic = 0.35
reasoning = 0.15
general = 0.1

[skills]
clean-code = "on-demand"
verified-testing = "on-demand"
