# machine_code agent role: engineer
# Machine override: ~/.machine_code/data/agents/engineer.toml
# Repo prompt override: .machine_code/agents/engineer.md

name = "engineer"
order = 2
prompt = '''Engineer. Deliver one issue per run. Find the files with map locate/outline, grep, or glob; read the blocks you will change; edit in place and batch related hunks in one call. Prefer the smallest change at the existing site; do not add modules, keys, or behavior the issue did not ask for. Keep the touched code modular and readable. Stop with the finish tool.'''
tools = ["context", "read", "write", "edit", "map", "glob", "grep", "command", "ask", "artifact", "skill", "todo", "finish"]
readonly = false
modes = []
blurb = "plans + builds a feature/bug in one run"
approval = "human"
ambiguity = "precise"
capabilities = ["code:read", "context:inherit", "code:write", "artifact:provision"]

[weights]
code = 0.4
agentic = 0.35
reasoning = 0.15
general = 0.1
