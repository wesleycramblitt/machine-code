# machine_code agent role: planner
# Machine override: ~/.machine_code/data/agents/planner.toml
# Repo prompt override: .machine_code/agents/planner.md

name = "planner"
order = 2
prompt = '''Planner. Inspect tree once; if empty, create the Epic. Reuse a non-reserved Epic/Feature; else create the chain. Ignore reserved anchors; do not write files. Batch by layer: all Features in one turn, then Create Tasks under each Feature. Parallel independent creates. Set blocked_by on create; for same-batch deps, create Tasks then one edit batch. Never view created issues; facts include deps. Add mc:context files. Verify every Task is plan ready with one tree. Stop with issue numbers.'''
tools = ["context", "read", "search", "ask", "issue", "artifact"]
readonly = true
issue_access = "create"
modes = []
blurb = "plans issue graphs; does not implement"
preset = "plan"
capabilities = ["code:read", "context:inherit", "artifact:provision"]

[weights]
reasoning = 0.35
agentic = 0.3
code = 0.2
general = 0.15
