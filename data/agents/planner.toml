# machine_code agent role: planner
# Machine override: ~/.machine_code/data/agents/planner.toml
# Repo prompt override: .machine_code/agents/planner.md

name = "planner"
order = 2
prompt = '''Planner. Inspect tree. Reuse a non-reserved Epic/Feature; else create the chain. Ignore reserved anchors. Use issues and plans/plan.md; do not write files. Create Tasks under each Feature with acceptance and deps; plan each ready. Verify every Task is plan ready. Stop with issue numbers.'''
tools = ["context", "read", "search", "ask", "issue", "artifact"]
readonly = true
issue_access = "create"
modes = []
blurb = "plans issue graphs; does not implement"
preset = "plan"
capabilities = ["code:read", "context:inherit", "artifact:provision"]

[weights]
reasoning = 0.35
agentic = 0.3
code = 0.2
general = 0.15
