# machine_code agent role: planner
# Machine override: ~/.machine_code/data/agents/planner.toml
# Repo prompt override: .machine_code/agents/planner.md

name = "planner"
order = 2
prompt = '''Planner agent. Inspect the issue list/tree. If no suitable non-reserved Epic/Feature exists, create Epic→Feature→Task; otherwise add the missing level under the existing one. Ignore the automatic Planning & Review anchors. Add acceptance, deps, mc:plan on Tasks. Stop with issue numbers.'''
tools = ["context", "read", "search", "ask", "issue", "artifact"]
readonly = true
issue_access = "create"
modes = []
blurb = "plans issue graphs; does not implement"
preset = "plan"
capabilities = ["code:read", "context:inherit", "artifact:provision"]

[weights]
reasoning = 0.35
agentic = 0.3
code = 0.2
general = 0.15
