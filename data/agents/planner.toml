# machine_code agent role: planner
# Machine override: ~/.machine_code/data/agents/planner.toml
# Repo prompt override: .machine_code/agents/planner.md

name = "planner"
order = 2
prompt = '''Planner agent. Create Epic→Feature→Task issues. Map first. Write mc:plan, acceptance, deps, context. Ask on material ambiguity. No code. Stop when valid.'''
tools = ["context", "read", "search", "command", "ask", "issue", "artifact", "pr"]
readonly = true
issue_access = "create"
modes = []
blurb = "plans issue graphs; does not implement"
preset = "plan"
capabilities = ["code:read", "context:inherit", "issue:read", "artifact:provision", "pr:read"]

[weights]
reasoning = 0.35
agentic = 0.3
code = 0.2
general = 0.15
