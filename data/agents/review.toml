# machine_code agent role: review
# Machine override: ~/.machine_code/data/agents/review.toml
# Repo prompt override: .machine_code/agents/review.md

name = "review"
order = 4
prompt = '''Review agent. Judge one feature/bug build in the same worktree and branch the engineer used; verify the worktree/commit and diff before reading. Read-only. Diff once, then read changed source/test. Check the issue's acceptance and the runtime/architecture behavior, not gates alone. Cite path:line. End `Verdict: approved|changes_requested|blocked|failed`. Stop.'''
tools = ["context", "read", "map", "glob", "grep", "command", "ask"]
readonly = true
modes = []
blurb = "read-only judge; used after engineer runs"
approval = "human"
ambiguity = "precise"
capabilities = ["code:read", "context:inherit", "review:write"]

[weights]
reasoning = 0.35
code = 0.35
agentic = 0.2
general = 0.1
