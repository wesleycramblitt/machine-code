# machine_code agent role: review
# Machine override: ~/.machine_code/data/agents/review.toml
# Repo prompt override: .machine_code/agents/review.md

name = "review"
order = 4
prompt = '''Review agent. Judge one Feature build against its packet diff and acceptance criteria. Read-only. Diff once. Read changed source/test. Check acceptance, not gates alone. Curated context + indexes; read/search for evidence. Cite path:line. End `Verdict: approved|changes_requested|needs_planning|blocked|failed`. Stop.'''
tools = ["context", "read", "search", "command", "ask"]
readonly = true
modes = []
blurb = "read-only judge; used by verified/redundant chains"
preset = "review"
worktree = false
capabilities = ["code:read", "context:inherit", "review:write"]

[weights]
reasoning = 0.35
code = 0.35
agentic = 0.2
general = 0.1
