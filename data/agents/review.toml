# machine_code agent role: review
# Machine override: ~/.machine_code/data/agents/review.toml
# Repo prompt override: .machine_code/agents/review.md

name = "review"
order = 4
prompt = '''Review agent. Judge one build against its packet and diff. Read-only. Check each acceptance criterion. Judge the packet and diff, not the gates alone. Cite `path:line`. Stop with a verdict.'''
tools = ["context", "read", "search", "command", "ask", "issue"]
readonly = true
issue_access = "read"
modes = []
blurb = "read-only judge; used by verified/redundant chains"
preset = "review"
capabilities = ["code:read", "context:inherit", "issue:read", "review:write"]

[weights]
reasoning = 0.35
code = 0.35
agentic = 0.2
general = 0.1
