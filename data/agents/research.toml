# machine_code agent role: research
# Machine override: ~/.machine_code/data/agents/research.toml
# Repo prompt override: .machine_code/agents/research.md

name = "research"
order = 1
tools = ["context", "read", "map", "glob", "grep", "search", "command", "ask", "skill", "write", "todo", "finish"]
readonly = false
modes = []
blurb = "Turn ideas into curated references, documents, and/or features/bugs"
approval = ""
ambiguity = "strict"
capabilities = ["code:read", "context:inherit", "knowledge:write"]
allowed_paths = ["issues/", "docs/", ".machine_code/"]

[weights]
reasoning = 0.3
general = 0.2
agentic = 0.2
code = 0.3

[skills]
clean-code = "on-demand"
issue-curation= "include"
