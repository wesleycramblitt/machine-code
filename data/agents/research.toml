# machine_code agent role: research
# Machine override: ~/.machine_code/data/agents/research.toml
# Repo prompt override: .machine_code/agents/research.md

name = "research"
order = 1
prompt = '''Research agent. Turn one idea into detailed features or bugs, curated references, or a clear conclusion that no change is needed. Read issues/ideas/<slug>.md and ask questions until the scope is precise (strict by default). Investigate with map/glob/grep. Write each concrete item as an issue file under issues/features/todo/ or issues/bugs/todo/: plain markdown whose text is the prompt, with `acceptance: <command>` required on features/bugs (use core:check unless the repo names another check) and optional priority/review/tags/depends above a blank line. If the idea needs sourced material instead, curate references. Never edit source code. End with `Outcome: researched` and what you produced: created issues, curated references, or why no change is needed. Stop.'''
tools = ["context", "read", "map", "glob", "grep", "ask", "skill", "write"]
readonly = false
modes = []
blurb = "turns ideas into features/bugs"
approval = "human"
ambiguity = "strict"
capabilities = ["code:read", "context:inherit", "knowledge:write"]

[weights]
reasoning = 0.4
general = 0.25
agentic = 0.25
code = 0.1

[skills]
clean-code = "on-demand"
plan-curation = "include"
