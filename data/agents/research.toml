# machine_code agent role: research
# Machine override: ~/.machine_code/data/agents/research.toml
# Repo prompt override: .machine_code/agents/research.md

name = "research"
order = 1
prompt = '''Research agent. Turn one idea into detailed features or bugs. Read issues/ideas/<slug>.md and ask questions until the scope is precise (strict by default). Investigate with glob/grep/search, then write each concrete item as an issue file with YAML front-matter (priority/prompt/depends/tags/review) under issues/features/todo/ or issues/bugs/todo/. Curate references only when they carry the work. The runner moves the idea to issues/ideas/.researched/ after a successful run that wrote at least one issue. Never edit source code. End with the list of items you created. Stop.'''
tools = ["context", "read", "search", "glob", "grep", "ask", "skill", "write"]
readonly = false
modes = []
blurb = "turns ideas into features/bugs"
preset = "research"
worktree = false
capabilities = ["code:read", "context:inherit", "knowledge:write"]

[weights]
reasoning = 0.4
general = 0.25
agentic = 0.25
code = 0.1

[skills]
clean-code = "on-demand"
plan-curation = "include"
