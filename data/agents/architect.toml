# machine_code agent role: architect
# Machine override: ~/.machine_code/data/agents/architect.toml
# Repo prompt override: .machine_code/agents/architect.md

name = "architect"
order = 2
prompt = '''Architect agent. Plan one packet. Map first. Name path:symbol and gates. No code. Stop.'''
tools = ["context", "read", "search", "task", "command", "ask", "issue", "pr"]
readonly = true
issue_access = "read"
modes = ["direct", "verified", "redundant"]
default_mode = "verified"
blurb = "plans packets; runner chains Architect → Build → gates"
preset = "orchestrate"
capabilities = ["code:read", "context:inherit", "artifact:write", "issue:read", "pr:read"]

[weights]
reasoning = 0.4
agentic = 0.3
code = 0.15
general = 0.15

# Mode behavior is data, not a TypeScript rule. The runner uses these fields
# to configure Build and decide whether Review runs.
[mode.direct]
verification = "direct"
review = false

[mode.verified]
verification = "verified"
review = false

[mode.redundant]
verification = "redundant"
review = true
