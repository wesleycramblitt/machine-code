# Hand-editable per-model capability/pricing overrides.
# Machine override: ~/.machine_code/data/model-overrides.toml
#
# Generated metadata, benchmarks, and curation are applied first; these entries
# win last. Keys are a catalogue key ("provider/id") or a canonical id.
# Removing a property falls back to generated data.
#
# Starting point: copy an entry from the generated data/models.toml snapshot.
# A model key (e.g. "openai/gpt-6-luna-pro") overrides every provider offer;
# an offer key (e.g. "openrouter/openai/gpt-6-luna-pro") overrides one offer.
# Keep the key exactly as it appears in the snapshot.
#
# [models."openrouter/openai/gpt-6-luna-pro"]
# reasoning = 9.3
# code = 6.7
# agentic = 7.0
# general = 6.5
# capability = 7.6          # optional composite override
# input = 0.10              # $/M tokens
# output = 0.50
# cache_read = 0.01
# cache_write = 0.125
# context = 1050000
# max_output = 128000
# free = false
# kind = "chat"            # chat | image | video | audio | embedding | rerank | guard | other
# coding = true            # false removes the model from all coding selection
# modes = ["reasoning", "tools", "vision", "structured-output"]

[models]
