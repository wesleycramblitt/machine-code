# machine_code behavior presets (shipped defaults).
# Machine override: ~/.machine_code/data/presets.toml
# Run flags and repo/machine policy override these per role.

[plan]
delegate = false
verification = "direct"
issues = "optional"
ask = true
approval = "human"
ambiguity = "precise"

[orchestrate]
delegate = true
verification = "verified"
issues = "optional"
ask = true
approval = "human"
ambiguity = "precise"

[implement]
delegate = false
verification = "verified"
issues = "optional"
ask = false
approval = "human"
ambiguity = "precise"

[review]
delegate = false
verification = "direct"
issues = "optional"
ask = false
approval = "human"
ambiguity = "precise"

[assistant]
delegate = false
verification = "direct"
issues = "disabled"
ask = true
approval = "human"
ambiguity = "precise"

[unrestricted]
delegate = true
verification = "verified"
issues = "optional"
ask = true
approval = "human"
ambiguity = "precise"
