# machine_code agent data (shipped defaults).
# Machine override: ~/.machine_code/data/agents.toml
# Repo prompt override: .machine_code/agents/<role>.md
#
# Roles are data-defined. `modes` is informational for the TUI; the runner
# enforces which roles can start which run mode. Prompts are relative to this
# file. Capability gating still lives in the harness, not in the prompt.

[roles.general]
prompt = "prompts/general.md"
tools = ["read", "ask"]
readonly = true
modes = ["solo"]
blurb = "answers questions; read tool only"
preset = "assistant"
capabilities = ["code:read", "context:inherit"]

[roles.architect]
prompt = "prompts/architect.md"
tools = ["read", "search", "task", "command", "ask", "issue", "pr"]
readonly = true
modes = ["direct", "verified", "redundant"]
blurb = "plans packets; runner chains Architect → Build → gates"
preset = "orchestrate"
capabilities = ["code:read", "context:inherit", "artifact:write", "issue:read", "pr:read"]

[roles.build]
prompt = "prompts/build.md"
tools = ["read", "write", "edit", "search", "command", "task", "ask", "issue"]
readonly = false
modes = []
blurb = "implements packets; not started directly"
preset = "implement"
capabilities = ["code:read", "context:inherit", "code:write", "issue:read"]

[roles.review]
prompt = "prompts/review.md"
tools = ["read", "search", "command", "ask", "issue"]
readonly = true
modes = []
blurb = "read-only judge; used by verified/redundant chains"
preset = "review"
capabilities = ["code:read", "context:inherit", "issue:read", "review:write"]

[roles.sudo]
prompt = "prompts/sudo.md"
tools = ["read", "write", "edit", "search", "command", "task", "ask", "issue", "pr"]
readonly = false
modes = ["solo"]
blurb = "full permissions; solo only"
preset = "unrestricted"
capabilities = ["code:read", "context:inherit", "code:write", "artifact:write", "issue:read", "pr:read", "pr:create", "pr:merge", "review:write"]

[roles.general.weights]
reasoning = 0.30
code = 0.30
agentic = 0.25
general = 0.15

[roles.architect.weights]
reasoning = 0.40
agentic = 0.30
code = 0.15
general = 0.15

[roles.build.weights]
code = 0.40
agentic = 0.35
reasoning = 0.15
general = 0.10

[roles.review.weights]
reasoning = 0.35
code = 0.35
agentic = 0.20
general = 0.10

[roles.sudo.weights]
agentic = 0.40
code = 0.30
reasoning = 0.20
general = 0.10

# Behavior presets. Run-level flags override these; repo/machine policy can
# override them per role.
[presets.plan]
delegate = false
verification = "direct"
issues = "optional"
ask = true
approval = "human"
ambiguity = "precise"

[presets.orchestrate]
delegate = true
verification = "verified"
issues = "optional"
ask = true
approval = "human"
ambiguity = "precise"

[presets.implement]
delegate = false
verification = "verified"
issues = "optional"
ask = false
approval = "human"
ambiguity = "precise"

[presets.review]
delegate = false
verification = "direct"
issues = "optional"
ask = false
approval = "human"
ambiguity = "precise"

[presets.assistant]
delegate = false
verification = "direct"
issues = "disabled"
ask = true
approval = "human"
ambiguity = "precise"

[presets.unrestricted]
delegate = true
verification = "verified"
issues = "optional"
ask = true
approval = "human"
ambiguity = "precise"
