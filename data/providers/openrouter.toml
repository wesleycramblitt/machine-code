# machine_code provider: openrouter
# Machine override: ~/.machine_code/data/providers/openrouter.toml

id = "openrouter"
name = "OpenRouter"
env_keys = ["OPENROUTER_API_KEY"]
funded = true
# Free calls through this setup are supported here (assume_free works only when true).
free_supported = true
modes = ["usage"]

[billing]
kind = "usage"
