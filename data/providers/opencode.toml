# machine_code provider: opencode
# Machine override: ~/.machine_code/data/providers/opencode.toml

id = "opencode"
name = "OpenCode"
env_keys = ["OPENCODE_API_KEY"]
funded = true
# Free calls through this setup are supported here (assume_free works only when true).
free_supported = false
modes = ["usage"]

[billing]
kind = "usage"
