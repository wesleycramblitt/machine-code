# machine_code provider: nvidia
# Machine override: ~/.machine_code/data/providers/nvidia.toml
#
# Disabled by default. NVIDIA serves this provider through NVCF async jobs
# (`NVCF-POLL-SECONDS: 3600`): the request holds the connection for minutes and
# the completion arrives in one batch at the end, so it is unusable for an
# interactive agent loop. Re-enable with `disabled = false` if that changes.

id = "nvidia"
name = "NVIDIA"
env_keys = ["NVIDIA_API_KEY"]
modes = ["free"]
disabled = true

[billing]
kind = "free_tier"
