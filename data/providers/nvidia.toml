# machine_code provider: nvidia
# Machine override: ~/.machine_code/data/providers/nvidia.toml
#
# NOTE 2026-11-09: NVIDIA serves through NVCF async jobs
# (`NVCF-POLL-SECONDS: 3600`): the request holds the connection until the whole
# completion is ready, so it is unusable for an interactive agent loop. The
# 2026-11-10 sweep hit the 20s first-token timeout on every model while the
# metadata listing reported ready. Disabled by default; remove `disabled` only
# after proving a real streaming completion works.
# Live /models listing keeps the catalogue honest about retired models.

id = "nvidia"
name = "NVIDIA"
env_keys = ["NVIDIA_API_KEY"]
modes = ["free"]
disabled = true
# Live /models listing: unknown ids are reported, never added (see groq).
live_listings = true
base_url = "https://integrate.api.nvidia.com/v1"

[billing]
kind = "free_tier"
